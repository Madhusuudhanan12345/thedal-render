<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse languages — தேடல்</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Catamaran:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05060f;
    --void-deep: #020208;
    --panel: rgba(18, 20, 38, 0.62);
    --panel-soft: rgba(18, 20, 38, 0.4);
    --panel-border: rgba(160, 170, 255, 0.14);
    --text-primary: #eef0ff;
    --text-muted: #9aa0c3;
    --text-faint: #5c6188;
    --accent-cyan: #5fe3d0;
    --accent-amber: #f2a154;
    --focus-ring: rgba(95, 227, 208, 0.5);
    --radius-lg: 18px;
    --radius-md: 12px;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; background: var(--void); font-family:"Inter",sans-serif; color: var(--text-primary); }
  a{ color: inherit; text-decoration: none; }

  #sky{ position: fixed; inset:0; z-index:0; background: var(--void-deep); }
  .nebula{
    position: fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(55% 40% at 12% 0%, rgba(74,29,71,0.35), transparent 60%),
      radial-gradient(45% 35% at 90% 8%, rgba(16,35,63,0.4), transparent 60%);
    mix-blend-mode: screen;
  }

  .topbar{
    position: relative; z-index: 5;
    display:flex; align-items:center; justify-content: space-between;
    gap: 20px; padding: 16px 28px;
    border-bottom: 1px solid var(--panel-border);
    background: rgba(5,6,15,0.7);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .logo{
    font-family:"Catamaran",sans-serif; font-weight:700; font-size:1.4rem;
    background: linear-gradient(180deg, #fff 0%, #a9b0ea 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .back-link{ font-size: 0.85rem; color: var(--text-muted); }
  .back-link:hover{ color: var(--accent-cyan); }

  main{ position:relative; z-index:3; max-width: 980px; margin: 0 auto; padding: 48px 24px 80px; }

  h1{
    font-family:"Space Grotesk",sans-serif; font-weight:700;
    font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 8px;
  }
  .lede{ color: var(--text-muted); margin: 0 0 40px; font-size: 0.98rem; }

  .lang-group{ margin-bottom: 34px; }
  .lang-group h2{
    font-family:"Space Grotesk",sans-serif; font-size: 1.1rem; font-weight:600;
    margin: 0 0 14px; display:flex; align-items:baseline; gap: 10px;
  }
  .lang-group h2 .count{ font-size: 0.78rem; font-weight:500; color: var(--text-faint); }

  .lesson-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .lesson-card{
    display:block; padding: 14px 16px;
    background: var(--panel); border:1px solid var(--panel-border);
    border-radius: var(--radius-md);
    transition: border-color 160ms ease, transform 160ms ease;
  }
  .lesson-card:hover{ border-color: rgba(95,227,208,0.4); transform: translateY(-2px); }
  .lesson-card .title{ font-size: 0.92rem; font-weight:600; margin-bottom: 4px; }
  .lesson-card .meta{ font-size: 0.75rem; color: var(--text-muted); }

  .empty{ color: var(--text-muted); font-size: 0.9rem; }

  a:focus-visible{ outline: 2px solid var(--accent-cyan); outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="nebula"></div>

<header class="topbar">
  <a class="logo" href="index.html">தேடல்</a>
  <a class="back-link" href="index.html">← Back to search</a>
</header>

<main>
  <h1>Browse all languages</h1>
  <p class="lede">Every lesson in Thedal, grouped by language. Pick one to open it in the search results view.</p>
  <div id="groups"><p class="empty">Loading…</p></div>
</main>

<script>
  (function () {
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canvas = document.getElementById('sky');
    if (reduceMotion) { canvas.style.display = 'none'; return; }
    var ctx = canvas.getContext('2d');
    var stars = [], W, H;
    function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    for (var i=0;i<160;i++) stars.push({
      x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.1+0.2,
      baseAlpha: Math.random()*0.4+0.15, speed: Math.random()*0.012+0.004, phase: Math.random()*Math.PI*2
    });
    function tick(){
      ctx.clearRect(0,0,W,H);
      for (var i=0;i<stars.length;i++){
        var s = stars[i]; s.phase += s.speed;
        var a = Math.max(0, s.baseAlpha + Math.sin(s.phase)*0.18);
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(238,240,255,'+a.toFixed(3)+')'; ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  fetch('/api/lessons')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var container = document.getElementById('groups');
      container.innerHTML = '';

      if (!data.lessons || data.lessons.length === 0) {
        container.innerHTML = '<p class="empty">No lessons yet. Run "npm run seed" on the backend.</p>';
        return;
      }

      var byLanguage = {};
      data.lessons.forEach(function (l) {
        if (!byLanguage[l.language]) byLanguage[l.language] = [];
        byLanguage[l.language].push(l);
      });

      Object.keys(byLanguage).sort().forEach(function (lang) {
        var group = document.createElement('div');
        group.className = 'lang-group';

        var heading = document.createElement('h2');
        heading.innerHTML = lang + ' <span class="count">' + byLanguage[lang].length + ' lesson' + (byLanguage[lang].length === 1 ? '' : 's') + '</span>';
        group.appendChild(heading);

        var grid = document.createElement('div');
        grid.className = 'lesson-grid';

        byLanguage[lang].forEach(function (lesson) {
          var card = document.createElement('a');
          card.className = 'lesson-card';
          card.href = 'results.html?q=' + encodeURIComponent(lesson.title);
          card.innerHTML =
            '<div class="title"></div>' +
            '<div class="meta"></div>';
          card.querySelector('.title').textContent = lesson.title;
          card.querySelector('.meta').textContent = lesson.category + ' · ' + lesson.difficulty;
          grid.appendChild(card);
        });

        group.appendChild(grid);
        container.appendChild(group);
      });
    })
    .catch(function () {
      document.getElementById('groups').innerHTML =
        '<p class="empty">Could not reach the backend. Start it with "npm start" and open this page at http://localhost:3000.</p>';
    });
</script>

</body>
</html>
