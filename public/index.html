<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thedal — search the universe of code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Catamaran:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05060f;
    --void-deep: #020208;
    --nebula-violet: #2a1f5e;
    --nebula-magenta: #4a1d47;
    --nebula-blue: #10233f;
    --panel: rgba(18, 20, 38, 0.55);
    --panel-border: rgba(160, 170, 255, 0.16);
    --text-primary: #eef0ff;
    --text-muted: #9aa0c3;
    --text-faint: #5c6188;
    --accent-cyan: #5fe3d0;
    --accent-amber: #f2a154;
    --focus-ring: rgba(95, 227, 208, 0.55);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--void);
    font-family: "Inter", sans-serif;
    color: var(--text-primary);
    overflow-x: hidden;
  }

  /* ---------- Cosmic background ---------- */
  #sky{
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: var(--void-deep);
  }

  .nebula{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(60% 50% at 18% 20%, rgba(74, 29, 71, 0.55), transparent 60%),
      radial-gradient(50% 45% at 82% 15%, rgba(16, 35, 63, 0.65), transparent 60%),
      radial-gradient(70% 60% at 50% 100%, rgba(42, 31, 94, 0.55), transparent 65%);
    mix-blend-mode: screen;
  }

  .vignette{
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(120% 100% at 50% 45%, transparent 45%, rgba(2,2,8,0.75) 100%);
  }

  /* ---------- Layout ---------- */
  main{
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8vh 24px 10vh;
    text-align: center;
  }

  .wordmark{
    font-family: "Catamaran", "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0;
    background: linear-gradient(180deg, #ffffff 0%, #c9cdf5 60%, #8d94d6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tamil-tag{
    margin-top: 10px;
    font-family: "Inter", sans-serif;
    font-size: 1rem;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .tamil-tag span.divider{
    color: var(--text-faint);
    margin: 0 10px;
  }

  /* ---------- Search box ---------- */
  form.search-form{
    margin-top: 52px;
    width: min(680px, 92vw);
  }

  .search-shell{
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 10px 8px 22px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
  }

  .search-shell:focus-within{
    border-color: rgba(95, 227, 208, 0.55);
    box-shadow: 0 0 0 4px var(--focus-ring), 0 20px 60px -18px rgba(0,0,0,0.65);
    transform: translateY(-1px);
  }

  .search-icon{
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    color: var(--text-muted);
    transition: color 220ms ease;
  }
  .search-shell:focus-within .search-icon{ color: var(--accent-cyan); }

  input.search-input{
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: "Inter", sans-serif;
    font-size: 1.05rem;
    font-weight: 450;
    padding: 14px 0;
  }
  input.search-input::placeholder{ color: var(--text-faint); }

  button.go-btn{
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent-cyan), #4aa8e0);
    color: #06121a;
    transition: filter 160ms ease, transform 160ms ease;
  }
  button.go-btn:hover{ filter: brightness(1.08); }
  button.go-btn:active{ transform: scale(0.94); }
  button.go-btn svg{ width: 19px; height: 19px; }

  button.go-btn:focus-visible,
  .pill:focus-visible,
  input.search-input:focus-visible{
    outline: 2px solid var(--accent-cyan);
    outline-offset: 2px;
  }

  /* ---------- Quick topic pills ---------- */
  .pills{
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    width: min(680px, 92vw);
  }

  .pill{
    font-family: "Inter", sans-serif;
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--text-muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(160,170,255,0.14);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
  }
  .pill:hover{
    color: var(--text-primary);
    border-color: rgba(95, 227, 208, 0.4);
    background: rgba(95, 227, 208, 0.08);
  }

  .footnote{
    position: relative;
    z-index: 3;
    margin-top: 56px;
    font-size: 0.78rem;
    color: var(--text-faint);
    letter-spacing: 0.01em;
  }

  .footnote a{ text-decoration: underline; text-decoration-color: rgba(95,227,208,0.4); text-underline-offset: 3px; }
  .footnote a:hover{ color: var(--accent-cyan); }

  @media (prefers-reduced-motion: reduce){
    #sky{ display: none; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="nebula"></div>
<div class="vignette"></div>

<main>
  <h1 class="wordmark">தேடல்</h1>
  <p class="tamil-tag">Thedal<span class="divider">·</span>an AI engine that answers in code</p>

  <form class="search-form" id="searchForm" action="results.html" method="get">
    <div class="search-shell">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        class="search-input"
        type="text"
        name="q"
        placeholder="Ask how a for-loop works, or paste an error..."
        aria-label="Search Thedal"
        autofocus
      >
      <button class="go-btn" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M13 6L19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </form>

  <div class="pills">
    <button class="pill" type="button" data-query="python for loop">Python basics</button>
    <button class="pill" type="button" data-query="c variables">Data structures</button>
    <button class="pill" type="button" data-query="javascript for loop">JavaScript DOM</button>
    <button class="pill" type="button" data-query="c for loop">C programming</button>
    <button class="pill" type="button" data-query="fix this error">Fix this error</button>
  </div>

  <p class="footnote"><a href="languages.html" style="color:inherit;">Browse all languages</a> · Web · Images · Videos · Social — coming online soon</p>
</main>

<script>
  // Lightweight animated starfield with slow drift + twinkle.
  // Respects prefers-reduced-motion (canvas is hidden via CSS in that case,
  // and the loop below is skipped so it never runs unnecessarily).
  (function () {
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    var canvas = document.getElementById('sky');
    var ctx = canvas.getContext('2d');
    var stars = [];
    var W, H;
    var STAR_COUNT = 260;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function makeStar() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.25,
        baseAlpha: Math.random() * 0.6 + 0.25,
        twinkleSpeed: Math.random() * 0.015 + 0.004,
        phase: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 0.02,
        driftY: (Math.random() - 0.5) * 0.02
      };
    }

    for (var i = 0; i < STAR_COUNT; i++) stars.push(makeStar());

    function tick() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.phase += s.twinkleSpeed;
        var alpha = s.baseAlpha + Math.sin(s.phase) * 0.25;
        if (alpha < 0) alpha = 0;
        s.x += s.driftX;
        s.y += s.driftY;
        if (s.x < 0) s.x = W;
        if (s.x > W) s.x = 0;
        if (s.y < 0) s.y = H;
        if (s.y > H) s.y = 0;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(238, 240, 255, ' + alpha.toFixed(3) + ')';
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  // Quick topic pills jump straight to the results page with that query
  document.querySelectorAll('.pill[data-query]').forEach(function (pill) {
    pill.addEventListener('click', function () {
      var q = pill.getAttribute('data-query');
      window.location.href = 'results.html?q=' + encodeURIComponent(q);
    });
  });
</script>

</body>
</html>
